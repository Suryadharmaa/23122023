62L112 52L130 59L143 48L156 57L176 52L181 64L202 61L207 73C236 80 249 99 249 121L257 127L246 134L255 145L242 151L245 165L228 166L222 180L206 179L194 190L179 184L165 194L149 189L135 195L123 187L106 190L96 179L79 180L76 167L61 164L64 151L52 147L59 134L49 127L60 118C58 94 72 79 88 69Z" fill="url(#_R_0_-fur)" stroke="#c5ad92" stroke-width="2.5" stroke-linejoin="round"></path><path d="M128 72L139 81M151 69L151 79M172 73L163 82" stroke="#d1bfa5" stroke-width="3" stroke-linecap="round"></path><g class="cat-eyes"><g><ellipse cx="110" cy="119" rx="22" ry="24" fill="#fffdfa" stroke="#99806a" stroke-width="2.5"></ellipse><ellipse cx="110" cy="119" rx="17" ry="20" fill="url(#_R_0_-eye)"></ellipse><ellipse cx="110" cy="119" rx="9" ry="17" fill="#302a26"></ellipse><circle cx="104" cy="111" r="6" fill="white"></circle><circle cx="115" cy="129" r="2.5" fill="#fffc"></circle></g><g><ellipse cx="191" cy="119" rx="22" ry="24" fill="#fffdfa" stroke="#99806a" stroke-width="2.5"></ellipse><ellipse cx="191" cy="119" rx="17" ry="20" fill="url(#_R_0_-eye)"></ellipse><ellipse cx="191" cy="119" rx="9" ry="17" fill="#302a26"></ellipse><circle cx="185" cy="111" r="6" fill="white"></circle><circle cx="196" cy="129" r="2.5" fill="#fffc"></circle></g></g><g class="cat-closed-eyes" fill="none" stroke="#775e4f" stroke-width="4" stroke-linecap="round"><path d="M92 123Q110 136 128 123M173 123Q191 136 209 123"></path></g><ellipse cx="105" cy="150" rx="22" ry="9" fill="#ebad9e" opacity=".5"></ellipse><ellipse cx="195" cy="150" rx="22" ry="9" fill="#ebad9e" opacity=".5"></ellipse><ellipse cx="132" cy="147" rx="23" ry="16" fill="#fff9ee"></ellipse><ellipse cx="168" cy="147" rx="23" ry="16" fill="#fff9ee"></ellipse><path d="M141 140Q150 136 159 140L150 148Z" fill="#bb8581"></path><path class="cat-mouth" d="M150 148v5q-6 8-13 1m13-1q6 8 13 1" fill="none" stroke="#775e4f" stroke-width="2.5" stroke-linecap="round"></path><ellipse class="cat-nom" cx="150" cy="158" rx="9" ry="7" fill="#8b5a50"></ellipse><g class="cat-whiskers" stroke="#ac947d" stroke-width="1.8" stroke-linecap="round"><path d="M115 147L76 139M113 153L73 156M185 147L223 139M187 153L227 156"></path></g></g></g><g class="cat-hearts" fill="#d67e96"><text x="42" y="85" font-size="24">♥</text><text x="235" y="68" font-size="19">♥</text><text x="209" y="34" font-size="15">♥</text></g><g class="cat-bubbles" fill="#d8f3ffbb" stroke="#fff" stroke-width="2"><circle cx="72" cy="176" r="19"></circle><circle cx="210" cy="169" r="24"></circle><circle cx="169" cy="74" r="17"></circle><circle cx="115" cy="225" r="15"></circle><circle cx="244" cy="105" r="10"></circle></g><g class="cat-zzz" fill="#aba0d1" font-weight="700"><text x="216" y="70" font-size="28">z</text><text x="239" y="48" font-size="20">z</text><text x="259" y="30" font-size="14">z</text></g><style>.persian-cat{display:block;width:100%;height:100%;overflow:visible}.cat-rig{transform-origin:150px 265px;animation:pet-breathe 3s ease-in-out infinite}.cat-kitten .cat-rig{--cat-size:.86}.cat-teen .cat-rig{--cat-size:.94}.cat-adult .cat-rig{--cat-size:1}.cat-tail{transform-origin:224px 220px;animation:pet-tail 3.5s ease-in-out infinite}.cat-eyes{transform-box:fill-box;transform-origin:center;animation:pet-blink 5s infinite}.cat-head{transform-origin:150px 180px}.cat-closed-eyes,.cat-nom,.cat-hearts,.cat-bubbles,.cat-zzz{display:none}.cat-sleepy .cat-eyes{display:none}.cat-sleepy .cat-closed-eyes{display:block}.cat-sleep .cat-zzz{display:block;animation:pet-float 2.8s infinite}.cat-sleep .cat-rig{animation-duration:5s}.cat-pet .cat-hearts{display:block;animation:pet-float 1.5s infinite}.cat-pet .cat-head{animation:pet-nuzzle .7s ease-in-out infinite alternate}.cat-eat .cat-nom{display:block;animation:pet-chew .4s infinite alternate}.cat-eat .cat-mouth{visibility:hidden}.cat-eat .cat-head{animation:pet-nuzzle .5s infinite alternate}.cat-wash .cat-bubbles{display:block;animation:pet-float 1.4s infinite}.cat-wash .cat-head{animation:pet-nuzzle .5s infinite alternate}.cat-play .cat-rig{animation:pet-hop .6s infinite alternate}.cat-play .cat-tail{animation-duration:.5s}.cat-walk .cat-paw-left{transform-origin:101px 230px;animation:pet-step .35s infinite alternate}.cat-walk .cat-paw-right{transform-origin:196px 230px;animation:pet-step .35s infinite alternate-reverse}.cat-walk .cat-rig{animation:pet-hop .4s infinite alternate}
@keyframes pet-breathe{0%,100%{transform:scale(var(--cat-size,1))}50%{transform:scale(calc(var(--cat-size,1) * 1.016),calc(var(--cat-size,1) * .99))}}@keyframes pet-tail{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(8deg)}}@keyframes pet-blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.05)}}@keyframes pet-float{0%{transform:translateY(8px);opacity:.25}50%{opacity:1}100%{transform:translateY(-15px);opacity:0}}@keyframes pet-nuzzle{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}@keyframes pet-chew{from{transform:scaleY(.3);transform-origin:150px 158px}to{transform:scaleY(1);transform-origin:150px 158px}}@keyframes pet-hop{from{transform:translateY(0) scale(var(--cat-size,1))}to{transform:translateY(-9px) scale(var(--cat-size,1))}}@keyframes pet-step{from{transform:rotate(-9deg) translateY(-3px)}to{transform:rotate(9deg) translateY(2px)}}@keyframes pet-nom{0%,100%{transform:translate(-50%,8px) scale(1)}50%{transform:translate(-50%,-5px) scale(.8)}}@keyframes pet-bounce{from{transform:translateY(-8px)}to{transform:translateY(7px)}}@keyframes pet-wiggle{from{transform:rotate(-25deg)}to{transform:rotate(25deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></svg>